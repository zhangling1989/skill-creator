version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: skill-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: skill_hub
      MYSQL_USER: skillhub
      MYSQL_PASSWORD: skillhub123
    ports:
      - "3307:3306"  # 改为 3307 避免与本地 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - skill-hub-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: skill-hub-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - skill-hub-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: skill-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skill-hub-network

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile
    container_name: skill-hub-backend
    environment:
      DATABASE_URL: mysql+pymysql://skillhub:skillhub123@mysql:3306/skill_hub
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: "False"
      MINIO_USE_HTTPS: "False"
      DEFAULT_FILE_BUCKET: skill-hub
      MINIO_BUCKET_NAME_SD: sd-generated-images
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - minio
      - redis
    volumes:
      - ./backend:/app
    networks:
      - skill-hub-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  skill-hub-network:
    driver: bridge
