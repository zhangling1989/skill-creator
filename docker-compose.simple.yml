version: '3.8'

services:
  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: skill-hub-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - skill-hub-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: skill-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skill-hub-network

volumes:
  minio_data:
  redis_data:

networks:
  skill-hub-network:
    driver: bridge
